<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background: clean white, hair-thin border -->
  <rect x="0.5" y="0.5" width="199" height="199" rx="24" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Three chevrons pointing right — suggests forward flow through the proxy.
       Warm Kite-style orange, single color, no gradients. -->
  <g stroke="#EB5B00" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 55 65 L 95 100 L 55 135"/>
    <path d="M 90 65 L 130 100 L 90 135"/>
    <path d="M 125 65 L 165 100 L 125 135"/>
  </g>
</svg>
