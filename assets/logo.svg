<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background: clean white with a hair-thin border -->
  <rect x="0.5" y="0.5" width="199" height="199" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Routing mark: 3 lines converge to a central pivot, then 3 lines diverge.
       Single blue, thin monoline, no gradients, no glow. -->
  <g stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" fill="none">
    <line x1="40" y1="70"  x2="100" y2="100"/>
    <line x1="40" y1="100" x2="100" y2="100"/>
    <line x1="40" y1="130" x2="100" y2="100"/>
    <line x1="100" y1="100" x2="160" y2="70"/>
    <line x1="100" y1="100" x2="160" y2="100"/>
    <line x1="100" y1="100" x2="160" y2="130"/>
  </g>

  <!-- Central pivot -->
  <circle cx="100" cy="100" r="4" fill="#2563EB"/>
</svg>
