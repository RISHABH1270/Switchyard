<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200">
  <defs>
    <clipPath id="rounded">
      <rect width="860" height="200" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Clean white background -->
    <rect width="860" height="200" fill="#FFFFFF"/>

    <!-- Hair-thin border -->
    <rect x="0.5" y="0.5" width="859" height="199" rx="12" fill="none" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Warm orange accent stripe at the very top -->
    <rect x="0" y="0" width="860" height="2" fill="#EB5B00"/>

    <!-- ── Logo mark (three chevrons) on the left ─────────────────── -->
    <g transform="translate(60, 52) scale(0.53)">
      <g stroke="#EB5B00" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 55 65 L 95 100 L 55 135"/>
        <path d="M 90 65 L 130 100 L 90 135"/>
        <path d="M 125 65 L 165 100 L 125 135"/>
      </g>
    </g>

    <!-- Subtle vertical divider between logo and wordmark -->
    <line x1="218" y1="60" x2="218" y2="140" stroke="#E5E7EB" stroke-width="1"/>

    <!-- ── Wordmark ─────────────────────────────────────────────────── -->
    <text x="244" y="98"
          font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
          font-size="46" font-weight="700" fill="#0F172A" letter-spacing="-1.1">
      Switchyard
    </text>

    <!-- Tagline -->
    <text x="246" y="128"
          font-family="'Inter', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif"
          font-size="13.5" font-weight="400" fill="#64748B" letter-spacing="0.3">
      HTTP reverse proxy · io_uring · kTLS · C++20
    </text>

    <!-- ── Right side badges — clean, outlined, warm accent ───────── -->
    <!-- Row 1: v0.1.0 + MIT -->
    <rect x="692" y="76" width="64" height="26" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="724" y="89" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace"
          font-size="11" fill="#64748B" text-anchor="middle" dominant-baseline="central">v0.1.0</text>

    <rect x="764" y="76" width="52" height="26" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="790" y="89" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace"
          font-size="11" fill="#64748B" text-anchor="middle" dominant-baseline="central">MIT</text>

    <!-- Row 2: primary tech badge — warm orange fill -->
    <rect x="692" y="108" width="124" height="26" rx="4" fill="#FFF4EC" stroke="#FDBA74" stroke-width="1"/>
    <text x="754" y="121" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace"
          font-size="11" fill="#EB5B00" text-anchor="middle" dominant-baseline="central">C++20 · Linux</text>
  </g>
</svg>
