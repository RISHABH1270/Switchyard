<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200">
  <defs>
    <clipPath id="rounded">
      <rect width="860" height="200" rx="14"/>
    </clipPath>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111C31"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="60%"  stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="activeRail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="activeRailR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0B1220"/>
      <stop offset="18%"  stop-color="#3B82F6"/>
      <stop offset="82%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#60A5FA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3B82F6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Background -->
    <rect width="860" height="200" fill="url(#bg)"/>
    <!-- Soft aura behind wordmark -->
    <ellipse cx="430" cy="100" rx="280" ry="90" fill="url(#bgAura)"/>

    <!-- Top/bottom accent lines -->
    <rect x="0" y="0"   width="860" height="2" fill="url(#borderGrad)"/>
    <rect x="0" y="198" width="860" height="2" fill="url(#borderGrad)"/>

    <!-- Subtle vertical divider between logo panel and wordmark -->
    <line x1="218" y1="48" x2="218" y2="152" stroke="#1E293B" stroke-width="1"/>

    <!-- ── Logo (routing hub) ── scaled into left panel ─────────────── -->
    <g transform="translate(60, 52) scale(0.53)">
      <!-- Ambient hub glow -->
      <circle cx="100" cy="100" r="60" fill="url(#hubGlow)"/>

      <!-- Left incoming rails (dim) -->
      <line x1="24" y1="56"  x2="80" y2="100" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <line x1="24" y1="144" x2="80" y2="100" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <!-- Left active rail -->
      <line x1="24" y1="100" x2="80" y2="100" stroke="url(#activeRail)" stroke-width="5" stroke-linecap="round"/>

      <!-- Left endpoint dots -->
      <circle cx="24" cy="56"  r="3.5" fill="#475569"/>
      <circle cx="24" cy="100" r="4.5" fill="#FFFFFF"/>
      <circle cx="24" cy="144" r="3.5" fill="#475569"/>

      <!-- Central switch -->
      <rect x="80" y="80" width="40" height="40" rx="5"
            transform="rotate(45 100 100)"
            fill="#0B1220" stroke="url(#blueGrad)" stroke-width="2.5"/>
      <circle cx="100" cy="100" r="6" fill="#FFFFFF"/>
      <circle cx="100" cy="100" r="10" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.35"/>

      <!-- Right outgoing rails (dim) -->
      <line x1="120" y1="100" x2="176" y2="56"  stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <line x1="120" y1="100" x2="176" y2="144" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <!-- Right active rail -->
      <line x1="120" y1="100" x2="176" y2="100" stroke="url(#activeRailR)" stroke-width="5" stroke-linecap="round"/>

      <!-- Right endpoint dots -->
      <circle cx="176" cy="56"  r="3.5" fill="#475569"/>
      <circle cx="176" cy="100" r="4.5" fill="#FFFFFF"/>
      <circle cx="176" cy="144" r="3.5" fill="#475569"/>
    </g>

    <!-- ── Wordmark ─────────────────────────────────────────────────── -->
    <text x="244" y="98"
          font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
          font-size="52" font-weight="800" fill="url(#wordmark)" letter-spacing="-1.2">
      Switchyard
    </text>

    <!-- Tagline -->
    <text x="246" y="130"
          font-family="'Inter', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif"
          font-size="13.5" font-weight="500" fill="#94A3B8" letter-spacing="0.6">
      State-first Reverse Proxy · Modern C++
    </text>

    <!-- ── Right side badges ────────────────────────────────────────── -->
    <!-- Row 1: v0.1.0 + MIT -->
    <rect x="692" y="76" width="64" height="26" rx="6" fill="#0F1B33" stroke="#1E293B" stroke-width="1"/>
    <text x="724" y="89" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace"
          font-size="11" fill="#94A3B8" text-anchor="middle" dominant-baseline="central">v0.1.0</text>

    <rect x="764" y="76" width="52" height="26" rx="6" fill="#0F1B33" stroke="#1E293B" stroke-width="1"/>
    <text x="790" y="89" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace"
          font-size="11" fill="#94A3B8" text-anchor="middle" dominant-baseline="central">MIT</text>

    <!-- Row 2: Built with C++ -->
    <rect x="692" y="108" width="124" height="26" rx="6"
          fill="#3B82F6" fill-opacity="0.12"
          stroke="#3B82F6" stroke-width="1" stroke-opacity="0.6"/>
    <text x="754" y="121" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace"
          font-size="11" fill="#93C5FD" text-anchor="middle" dominant-baseline="central">Built with C++</text>
  </g>
</svg>
